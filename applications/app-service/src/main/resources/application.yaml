server:
  port: 8081
spring:
  application:
    name: "crediya-solicitudes-ms"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/crediya_db}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
logging:
  pattern:
    correlation: "[%X{traceId:-sin-traza}] "
