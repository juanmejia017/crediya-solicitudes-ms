server:
  port: 8081
spring:
  application:
    name: "crediya-solicitudes-ms"
  devtools:
    add-properties: false
  profiles:
    include: null
adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"
    port: ${DB_PORT:5432}
    database: "${DB_NAME:crediya_db}"
    schema: "${DB_SCHEMA:public}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
logging:
  level:
    co.com.crediya: info
